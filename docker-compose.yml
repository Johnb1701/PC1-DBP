services:
  postgres:
    image: postgres:16-alpine
    container_name: pc1-postgres
    restart: always
    environment:
      POSTGRES_DB: pc1_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:3
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
